name: LANProxy Native v3.3.2 Final UI

on:
  push:
    branches:
      - lanproxy-native-v332-final-ui
    paths:
      - 'lanproxy-native-v332/**'
      - '.github/workflows/lanproxy-native-v332.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Rebuild exact v3.3.1 source
        shell: pwsh
        run: |
          $src = '.\lanproxy-native-v332\src'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          New-Item -ItemType Directory -Path $src -Force | Out-Null

          $chunkNames = @('source.chunk00x','source.chunk01','source.chunk02','source.chunk03','source.chunk04','source.chunk05','source.chunk06','source.chunk07','source.chunk08')
          $expected = @(4000,4000,4000,4000,4000,4000,4000,4000,2880)
          $segments = @()
          for($i=0; $i -lt $chunkNames.Count; $i++) {
            $path = Join-Path '.\lanproxy-native-v330' $chunkNames[$i]
            if(-not (Test-Path $path)) { throw "Missing v3.3 source chunk: $path" }
            $s = (Get-Content $path -Raw).Trim()
            if($s.Length -ne $expected[$i]) { throw "Unexpected source chunk length: $($chunkNames[$i])=$($s.Length)" }
            $segments += $s
          }
          $all = $segments -join ''
          if($all.Length -ne 34880) { throw "Combined source length mismatch: $($all.Length)" }
          [IO.File]::WriteAllBytes('.\lanproxy-native-v332\main.go.gz', [Convert]::FromBase64String($all))
          $in = [IO.File]::OpenRead((Resolve-Path '.\lanproxy-native-v332\main.go.gz'))
          try {
            $gz = New-Object IO.Compression.GzipStream($in, [IO.Compression.CompressionMode]::Decompress)
            try {
              $out = [IO.File]::Create((Join-Path (Resolve-Path $src) 'main.go'))
              try { $gz.CopyTo($out) } finally { $out.Dispose() }
            } finally { $gz.Dispose() }
          } finally { $in.Dispose() }
          $mainHash=(Get-FileHash (Join-Path $src 'main.go') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mainHash -ne '9360829c7c6d37b8b6f462b74bd1fc8d1d3897012c01955418a09619449fff5b') { throw "Base v3.3 source hash mismatch: $mainHash" }
          Copy-Item '.\lanproxy-native-v310\app.manifest' (Join-Path $src 'app.manifest') -Force
          Copy-Item '.\lanproxy-native-v310\go.mod' (Join-Path $src 'go.mod') -Force

          @'
          from pathlib import Path
          p = Path(r'lanproxy-native-v332/src/main.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('appVersion = "3.3.0"', 'appVersion = "3.3.1"', 1)
          s = s.replace(', 1080, 600, 0, 0, hInst, 0)', ', 1040, 700, 0, 0, hInst, 0)', 1)
          start = s.index('func drawWifi(')
          end = s.index('\nfunc ', start + 10)
          logo = r'''func drawWifi(hdc syscall.Handle, x, y int32) {
              blue := rgb(20, 103, 232)
              white := rgb(255, 255, 255)
              soft := rgb(220, 235, 255)
              fillRounded(hdc, RECT{x, y, x + 38, y + 38}, 10, blue)
              rounded(hdc, RECT{x + 4, y + 13, x + 15, y + 24}, 2, blue, white)
              line(hdc, x+3, y+27, x+16, y+27, white, 2)
              line(hdc, x+6, y+25, x+13, y+25, soft, 1)
              circle(hdc, x+20, y+20, 2, white, white)
              line(hdc, x+20, y+18, x+24, y+15, white, 2)
              line(hdc, x+24, y+15, x+27, y+16, white, 2)
              line(hdc, x+20, y+22, x+24, y+25, white, 2)
              line(hdc, x+24, y+25, x+27, y+24, white, 2)
              line(hdc, x+22, y+20, x+26, y+20, soft, 2)
              rounded(hdc, RECT{x + 28, y + 10, x + 34, y + 28}, 2, blue, white)
              line(hdc, x+30, y+13, x+32, y+13, soft, 1)
              line(hdc, x+30, y+25, x+32, y+25, soft, 1)
          }
          '''
          s = s[:start] + logo + s[end:]
          p.write_text(s, encoding='utf-8')
          '@ | Set-Content '.\lanproxy-native-v332\rebuild_v331.py' -Encoding utf8
          python '.\lanproxy-native-v332\rebuild_v331.py'
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebuild v3.3.1 source' }
          gofmt -w '.\lanproxy-native-v332\src\main.go'

      - name: Apply v3.3.2 final UI patch
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; r=pathlib.Path('lanproxy-native-v332'); (r/'v332-ui.patch').write_bytes(gzip.decompress(base64.b64decode((r/'v332-ui.patch.gz.b64').read_text(encoding='utf-8').strip())))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decode v3.3.2 UI patch' }
          git apply --check --directory=lanproxy-native-v332/src lanproxy-native-v332/v332-ui.patch
          if ($LASTEXITCODE -ne 0) { throw 'v3.3.2 UI patch validation failed' }
          git apply --directory=lanproxy-native-v332/src lanproxy-native-v332/v332-ui.patch
          if ($LASTEXITCODE -ne 0) { throw 'v3.3.2 UI patch failed' }
          gofmt -w '.\lanproxy-native-v332\src\main.go'
          $patched=(Get-Content '.\lanproxy-native-v332\src\main.go' -Raw)
          if($patched -notmatch 'appVersion = "3.3.2"'){ throw 'Version patch missing' }
          if($patched -notmatch '1024, 640'){ throw '16:10 window patch missing' }
          if($patched -notmatch 'computer at the bottom emits Wi-Fi upward'){ throw 'Vertical brand mark patch missing' }

      - name: Generate vertical computer Wi-Fi phone icon
        shell: pwsh
        run: |
          python -m pip install pillow --disable-pip-version-check -q
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path

          SCALE=4
          def icon(size):
              S=size*SCALE
              im=Image.new('RGBA',(S,S),(0,0,0,0))
              mask=Image.new('L',(S,S),0)
              md=ImageDraw.Draw(mask)
              m=int(S*.055)
              md.rounded_rectangle((m,m,S-m,S-m),radius=int(S*.22),fill=255)
              bg=Image.new('RGBA',(S,S),(0,0,0,0)); px=bg.load()
              top=(30,113,237); bottom=(16,82,205)
              for y in range(S):
                  t=y/max(1,S-1)
                  col=tuple(round(top[i]*(1-t)+bottom[i]*t) for i in range(3))+(255,)
                  for x in range(S): px[x,y]=col
              im=Image.composite(bg,im,mask)
              d=ImageDraw.Draw(im)
              W=(255,255,255,255); SOFT=(221,237,255,255)
              def sc(v): return int(v*S)
              def rr(box,r,outline=W,w=.032):
                  d.rounded_rectangle(tuple(sc(v) for v in box),radius=max(1,sc(r)),outline=outline,width=max(1,sc(w)))

              # Phone receiver at the top.
              rr((.39,.12,.61,.36),.035,W,.03)
              d.line((sc(.46),sc(.17),sc(.54),sc(.17)),fill=SOFT,width=max(1,sc(.012)))
              d.ellipse((sc(.493),sc(.315),sc(.507),sc(.329)),fill=W)

              # Wi-Fi travelling upward from the computer.
              for box,width in [((.25,.31,.75,.66),.038),((.32,.38,.68,.64),.038),((.39,.45,.61,.62),.04)]:
                  d.arc(tuple(sc(v) for v in box),start=205,end=335,fill=W,width=max(1,sc(width)))
              d.ellipse((sc(.475),sc(.61),sc(.525),sc(.66)),fill=W)

              # Computer source at the bottom.
              rr((.23,.69,.77,.84),.035,W,.032)
              d.line((sc(.50),sc(.84),sc(.50),sc(.89)),fill=W,width=max(1,sc(.024)))
              d.line((sc(.39),sc(.89),sc(.61),sc(.89)),fill=W,width=max(1,sc(.028)))
              return im.resize((size,size),Image.Resampling.LANCZOS)

          out=Path(r'lanproxy-native-v332/src/app.ico')
          master=icon(256)
          master.save(out,format='ICO',sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])
          print('icon bytes',out.stat().st_size)
          '@ | Set-Content '.\lanproxy-native-v332\make_icon.py' -Encoding utf8
          python '.\lanproxy-native-v332\make_icon.py'
          if ($LASTEXITCODE -ne 0) { throw 'Application icon generation failed' }

      - name: Embed original manifest and final icon
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v332\src
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico app.ico -arch amd64 -o resource_windows_amd64.syso
          if (-not (Test-Path '.\resource_windows_amd64.syso')) { throw 'resource syso was not created' }

      - name: Build with v3.3 compiler and linker mode
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v332\src
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '..\局域网代理共享助手.exe' .
          $app=Get-Item '..\局域网代理共享助手.exe'
          Write-Host "EXE size=$($app.Length) bytes"
          if ($app.Length -gt 10000000) { throw 'Native EXE unexpectedly exceeds 10 MB' }

      - name: Smoke test and capture pages
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\lanproxy-native-v332\局域网代理共享助手.exe').Path
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(15)
          do { Start-Sleep -Milliseconds 400; $p.Refresh(); if($p.HasExited){throw "App exited early code $($p.ExitCode)"} } until($p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if($p.MainWindowHandle -eq 0){ Stop-Process $p -Force -ErrorAction SilentlyContinue; throw 'No main window appeared' }
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class NC { [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessageTimeout(IntPtr h,uint m,IntPtr w,IntPtr l,uint f,uint t,out IntPtr r); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r); [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l); public struct RECT { public int Left,Top,Right,Bottom; } }'
          $r=[IntPtr]::Zero
          if([NC]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$r) -eq [IntPtr]::Zero){throw 'UI not responding'}
          Start-Sleep -Seconds 8
          $p.Refresh(); if($p.HasExited){throw 'App exited during startup scan'}
          $wr=New-Object NC+RECT
          [void][NC]::GetWindowRect($p.MainWindowHandle,[ref]$wr)
          $w=$wr.Right-$wr.Left; $h=$wr.Bottom-$wr.Top
          Write-Host "Actual window size: ${w}x${h}; ratio=$([math]::Round($w/$h,3))"
          if($w -lt 1000 -or $w -gt 1050 -or $h -lt 620 -or $h -gt 660){throw 'Unexpected final window dimensions'}

          function Shot([string]$name) {
            $p.Refresh(); [void][NC]::GetWindowRect($p.MainWindowHandle,[ref]$wr)
            $ww=$wr.Right-$wr.Left; $hh=$wr.Bottom-$wr.Top
            $bmp=New-Object Drawing.Bitmap $ww,$hh
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($wr.Left,$wr.Top,0,0,(New-Object Drawing.Size $ww,$hh))
            $path=(Resolve-Path '.\lanproxy-native-v332').Path+'\'+$name+'.png'
            $bmp.Save($path,[Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Click([int]$x,[int]$y) {
            $lp=[IntPtr](($y -shl 16) -bor ($x -band 0xffff))
            [void][NC]::PostMessage($p.MainWindowHandle,0x0201,[IntPtr]1,$lp)
            [void][NC]::PostMessage($p.MainWindowHandle,0x0202,[IntPtr]0,$lp)
            Start-Sleep -Milliseconds 700
          }
          Shot 'home'
          Click 570 32; Shot 'phone'
          Click 665 32; Shot 'devices'
          Click 770 32; Shot 'advanced'
          Stop-Process $p -Force -ErrorAction SilentlyContinue

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\lanproxy-native-v332\局域网代理共享助手.exe').Path
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256=$hash"
          Set-Content '.\lanproxy-native-v332\sha256.txt' $hash -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v3.3.2-final-ui
          path: |
            .\lanproxy-native-v332\局域网代理共享助手.exe
            .\lanproxy-native-v332\sha256.txt
            .\lanproxy-native-v332\home.png
            .\lanproxy-native-v332\phone.png
            .\lanproxy-native-v332\devices.png
            .\lanproxy-native-v332\advanced.png
          if-no-files-found: warn
