name: LANProxy Native v3.3.4 Foolproof Final

on:
  push:
    branches:
      - lanproxy-native-v334-foolproof
    paths:
      - 'lanproxy-native-v334/**'
      - '.github/workflows/lanproxy-native-v334.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Rebuild v3.3.3 source and apply v3.3.4 patch
        shell: pwsh
        run: |
          $base = '.\lanproxy-native-v333'
          $root = '.\lanproxy-native-v334'
          $src = Join-Path $root 'src'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          New-Item -ItemType Directory -Path $src -Force | Out-Null

          $names = @('source.part00','source.fix01a','source.fix01b','source.fix02a','source.fix02b','source.part03','source.part04','source.part05')
          $payload = ($names | ForEach-Object { (Get-Content (Join-Path $base $_) -Raw).Trim() }) -join ''
          if ($payload.Length -ne 35520) { throw "Combined v3.3.3 payload length mismatch: $($payload.Length)" }
          [IO.File]::WriteAllBytes((Join-Path $root 'main.go.gz'), [Convert]::FromBase64String($payload))
          $in = [IO.File]::OpenRead((Resolve-Path (Join-Path $root 'main.go.gz')))
          try {
            $gz = New-Object IO.Compression.GzipStream($in, [IO.Compression.CompressionMode]::Decompress)
            try {
              $out = [IO.File]::Create((Join-Path (Resolve-Path $src) 'main.go'))
              try { $gz.CopyTo($out) } finally { $out.Dispose() }
            } finally { $gz.Dispose() }
          } finally { $in.Dispose() }

          $baseHash=(Get-FileHash (Join-Path $src 'main.go') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne '180a5cdd824e88aff2bf67eaf7ca221a617ec2dfd98ff7bfad636c7d6b0aeb8f') { throw "Base v3.3.3 source hash mismatch: $baseHash" }

          python -c "import base64,gzip,pathlib; r=pathlib.Path('lanproxy-native-v334'); (r/'v334.patch').write_bytes(gzip.decompress(base64.b64decode((r/'v334.patch.gz.b64').read_text(encoding='utf-8').strip())))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decode v3.3.4 patch' }
          git apply --check --directory=lanproxy-native-v334/src lanproxy-native-v334/v334.patch
          if ($LASTEXITCODE -ne 0) { throw 'v3.3.4 patch validation failed' }
          git apply --directory=lanproxy-native-v334/src lanproxy-native-v334/v334.patch
          if ($LASTEXITCODE -ne 0) { throw 'v3.3.4 patch failed' }
          gofmt -w (Join-Path $src 'main.go')

          $hash=(Get-FileHash (Join-Path $src 'main.go') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "v3.3.4 main.go SHA256=$hash"
          if ($hash -ne '50d0700eb34068dccfc827449c25c2843fe520fc93cb1f67f46cb7b73c6cb58f') { throw 'v3.3.4 source hash mismatch' }
          Copy-Item '.\lanproxy-native-v310\app.manifest' (Join-Path $src 'app.manifest') -Force
          Copy-Item '.\lanproxy-native-v310\go.mod' (Join-Path $src 'go.mod') -Force

      - name: Generate vertical computer Wi-Fi phone icon
        shell: pwsh
        run: |
          python -m pip install pillow --disable-pip-version-check -q
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path

          def make_icon(size):
              q=4; S=size*q
              im=Image.new('RGBA',(S,S),(0,0,0,0))
              mask=Image.new('L',(S,S),0); md=ImageDraw.Draw(mask)
              pad=int(S*.055)
              md.rounded_rectangle((pad,pad,S-pad,S-pad), radius=int(S*.22), fill=255)
              bg=Image.new('RGBA',(S,S),(0,0,0,0)); px=bg.load()
              top=(34,119,238); bottom=(15,89,205)
              for y in range(S):
                  t=y/max(1,S-1)
                  col=tuple(round(top[i]*(1-t)+bottom[i]*t) for i in range(3))+(255,)
                  for x in range(S): px[x,y]=col
              im=Image.composite(bg,im,mask)
              d=ImageDraw.Draw(im)
              W=(255,255,255,255); SOFT=(225,239,255,255)
              def sc(v): return int(v*S)
              def rr(box,r,w=.03):
                  d.rounded_rectangle(tuple(sc(v) for v in box), radius=max(1,sc(r)), outline=W, width=max(1,sc(w)))
              rr((.405,.10,.595,.33),.033,.028)
              d.line((sc(.46),sc(.145),sc(.54),sc(.145)), fill=SOFT, width=max(1,sc(.012)))
              d.ellipse((sc(.487),sc(.285),sc(.513),sc(.311)), fill=W)
              for box,wd in [((.23,.28,.77,.68),.037),((.31,.36,.69,.66),.038),((.39,.44,.61,.64),.04)]:
                  d.arc(tuple(sc(v) for v in box), start=205, end=335, fill=W, width=max(1,sc(wd)))
              d.ellipse((sc(.475),sc(.61),sc(.525),sc(.66)), fill=W)
              rr((.20,.70,.80,.85),.035,.03)
              d.line((sc(.50),sc(.85),sc(.50),sc(.90)), fill=W, width=max(1,sc(.022)))
              d.line((sc(.38),sc(.90),sc(.62),sc(.90)), fill=W, width=max(1,sc(.028)))
              return im.resize((size,size), Image.Resampling.LANCZOS)

          out=Path(r'lanproxy-native-v334/src/app.ico')
          master=make_icon(256)
          master.save(out, format='ICO', sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content '.\lanproxy-native-v334\make_icon.py' -Encoding utf8
          python '.\lanproxy-native-v334\make_icon.py'
          if ($LASTEXITCODE -ne 0) { throw 'Application icon generation failed' }

      - name: Embed manifest and icon
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v334\src
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico app.ico -arch amd64 -o resource_windows_amd64.syso
          if (-not (Test-Path '.\resource_windows_amd64.syso')) { throw 'resource syso was not created' }

      - name: Build stable single EXE
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v334\src
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '..\局域网代理共享助手.exe' .
          $app=Get-Item '..\局域网代理共享助手.exe'
          Write-Host "EXE size=$($app.Length) bytes"
          if ($app.Length -gt 10000000) { throw 'Native EXE unexpectedly exceeds 10 MB' }

      - name: Smoke test foolproof ports and capture pages
        shell: pwsh
        run: |
          $cfgDir=Join-Path $env:LOCALAPPDATA 'LANProxyShareAssistant'
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          '{"ip":"","http_local":0,"socks_local":0,"http_lan":99999,"socks_lan":-1,"share_socks":false,"last_process":""}' | Set-Content (Join-Path $cfgDir 'config.json') -Encoding utf8

          $exe=(Resolve-Path '.\lanproxy-native-v334\局域网代理共享助手.exe').Path
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(15)
          do { Start-Sleep -Milliseconds 400; $p.Refresh(); if($p.HasExited){throw "App exited early code $($p.ExitCode)"} } until($p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if($p.MainWindowHandle -eq 0){ Stop-Process $p -Force -ErrorAction SilentlyContinue; throw 'No main window appeared' }

          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Text; using System.Runtime.InteropServices; public static class NC { [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessageTimeout(IntPtr h,uint m,IntPtr w,IntPtr l,uint f,uint t,out IntPtr r); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r); [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l); [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h,int id); [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int n); [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern bool SetWindowText(IntPtr h,string s); public struct RECT { public int Left,Top,Right,Bottom; } }'
          function EditText([int]$id) { $e=[NC]::GetDlgItem($p.MainWindowHandle,$id); $sb=New-Object Text.StringBuilder 64; [void][NC]::GetWindowText($e,$sb,$sb.Capacity); return $sb.ToString() }

          $result=[IntPtr]::Zero
          if([NC]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$result) -eq [IntPtr]::Zero){throw 'UI not responding immediately'}
          if((EditText 1304) -ne '18800'){throw "Invalid saved HTTP share port was not auto-repaired: $(EditText 1304)"}
          if((EditText 1305) -ne '11020'){throw "Invalid saved SOCKS share port was not auto-repaired: $(EditText 1305)"}

          # Re-introduce an invalid value at runtime, then click Start Sharing. The action must repair it before doing anything else.
          $httpEdit=[NC]::GetDlgItem($p.MainWindowHandle,1304)
          [void][NC]::SetWindowText($httpEdit,'99999')
          Start-Sleep -Milliseconds 250
          $lp=[IntPtr](((270) -shl 16) -bor (100 -band 0xffff))
          [void][NC]::PostMessage($p.MainWindowHandle,0x0201,[IntPtr]1,$lp); [void][NC]::PostMessage($p.MainWindowHandle,0x0202,[IntPtr]0,$lp)
          Start-Sleep -Milliseconds 900
          if((EditText 1304) -ne '18800'){throw "Runtime invalid HTTP share port was not auto-repaired: $(EditText 1304)"}

          Start-Sleep -Seconds 6
          $p.Refresh(); if($p.HasExited){throw 'App exited during startup scan'}
          $result=[IntPtr]::Zero
          if([NC]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$result) -eq [IntPtr]::Zero){throw 'UI froze during scan'}
          $wr=New-Object NC+RECT
          [void][NC]::GetWindowRect($p.MainWindowHandle,[ref]$wr)
          $w=$wr.Right-$wr.Left; $h=$wr.Bottom-$wr.Top
          Write-Host "Actual window size: ${w}x${h}; ratio=$([math]::Round($w/$h,3))"
          if($w -lt 1000 -or $w -gt 1050 -or $h -lt 620 -or $h -gt 660){throw 'Unexpected window dimensions'}

          function Shot([string]$name) {
            $p.Refresh(); [void][NC]::GetWindowRect($p.MainWindowHandle,[ref]$wr)
            $ww=$wr.Right-$wr.Left; $hh=$wr.Bottom-$wr.Top
            $bmp=New-Object Drawing.Bitmap $ww,$hh
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($wr.Left,$wr.Top,0,0,(New-Object Drawing.Size $ww,$hh))
            $path=(Resolve-Path '.\lanproxy-native-v334').Path+'\'+$name+'.png'
            $bmp.Save($path,[Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Click([int]$x,[int]$y) {
            $lp=[IntPtr](($y -shl 16) -bor ($x -band 0xffff))
            [void][NC]::PostMessage($p.MainWindowHandle,0x0201,[IntPtr]1,$lp)
            [void][NC]::PostMessage($p.MainWindowHandle,0x0202,[IntPtr]0,$lp)
            Start-Sleep -Milliseconds 700
          }
          Shot 'home'
          Click 586 32; Shot 'phone'
          Click 684 32; Shot 'devices'
          Click 793 32; Shot 'advanced'
          Stop-Process $p -Force -ErrorAction SilentlyContinue

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\lanproxy-native-v334\局域网代理共享助手.exe').Path
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256=$hash"
          Set-Content '.\lanproxy-native-v334\sha256.txt' $hash -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v3.3.4-foolproof-final
          path: |
            .\lanproxy-native-v334\局域网代理共享助手.exe
            .\lanproxy-native-v334\sha256.txt
            .\lanproxy-native-v334\home.png
            .\lanproxy-native-v334\phone.png
            .\lanproxy-native-v334\devices.png
            .\lanproxy-native-v334\advanced.png
          if-no-files-found: error
