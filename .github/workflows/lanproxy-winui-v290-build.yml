name: LANProxy WinUI v2.9 build

on:
  push:
    branches:
      - lanproxy-winui-v290-build-temp
    paths:
      - 'lanproxy-v290-build/**'
      - '.github/workflows/lanproxy-winui-v290-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rebuild source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem .\lanproxy-v290-build\source.part* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\lanproxy-v290-build\source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path .\lanproxy-v290-build\source.zip -DestinationPath .\lanproxy-v290-build\src -Force
          $proj = Get-ChildItem .\lanproxy-v290-build\src -Recurse -Filter LANProxyShareAssistant.csproj | Select-Object -First 1
          if (-not $proj) { throw 'LANProxyShareAssistant.csproj not found after extraction.' }
          "PROJECT_PATH=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:PROJECT_PATH"
      - name: Publish portable x64
        shell: pwsh
        run: dotnet publish "$env:PROJECT_PATH" -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -p:PublishTrimmed=false -o .\lanproxy-v290-build\dist
      - name: Verify real application executable
        shell: pwsh
        run: |
          $appExe = '.\lanproxy-v290-build\dist\局域网代理共享助手.exe'
          if (-not (Test-Path $appExe)) { throw 'Real application executable not found.' }
          $app = Get-Item $appExe
          Write-Host "App EXE: $($app.FullName) size=$($app.Length)"
          if ($app.Length -lt 150000) { throw "Application EXE is unexpectedly small ($($app.Length) bytes). Refusing to package helper executable by mistake." }
      - name: Startup smoke test
        shell: pwsh
        run: |
          $appExe = (Resolve-Path '.\lanproxy-v290-build\dist\局域网代理共享助手.exe').Path
          $started = Get-Date
          Write-Host "Launching $appExe"
          $p = Start-Process -FilePath $appExe -WorkingDirectory (Split-Path $appExe) -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "Process exited early with code $($p.ExitCode)"
            Write-Host 'Recent Application events:'
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started.AddSeconds(-2)} -ErrorAction SilentlyContinue | Select-Object -First 20 TimeCreated, Id, ProviderName, LevelDisplayName, Message | Format-List | Out-String -Width 240 | Write-Host
            throw "Startup smoke test failed. ExitCode=$($p.ExitCode)"
          }
          Write-Host "Process remained alive for 6 seconds; startup smoke test passed. PID=$($p.Id)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Pack portable zip
        shell: pwsh
        run: |
          $appExe = '.\lanproxy-v290-build\dist\局域网代理共享助手.exe'
          if (-not (Test-Path $appExe)) { throw 'Real application executable not found before packaging.' }
          $readme = @'
          局域网代理共享助手 v2.9.0 启动修复版
          
          使用方法：
          1. 完整解压本压缩包。
          2. 双击局域网代理共享助手.exe。
          3. 软件会自动检测局域网与本机代理。
          4. 开启共享后，手机在同一局域网内设置 HTTP 手动代理。
          
          修复：便携包打包时误将 createdump.exe 覆盖主程序的问题。
          '@
          Set-Content -Path .\lanproxy-v290-build\dist\使用说明.txt -Value $readme -Encoding UTF8
          Compress-Archive -Path .\lanproxy-v290-build\dist\* -DestinationPath .\lanproxy-v290-build\LANProxyShareAssistant_v2.9.0_WinUI3_StartupFix_Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v2.9.0-startup-fix-win-x64
          path: .\lanproxy-v290-build\LANProxyShareAssistant_v2.9.0_WinUI3_StartupFix_Portable.zip
          if-no-files-found: error
