name: LANProxy Native v3.5 Balanced Ratio Logo

on:
  push:
    branches:
      - lanproxy-native-v340-ratio-logo
    paths:
      - '.github/workflows/lanproxy-native-v350.yml'
      - 'lanproxy-native-v330/source.chunk*'
      - 'lanproxy-native-v310/app.manifest'
      - 'lanproxy-native-v310/go.mod'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Rebuild v3.3 source and apply ratio/logo-only v3.5 changes
        shell: pwsh
        run: |
          $src = '.\lanproxy-native-v350\src'
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          $chunkNames = @('source.chunk00x','source.chunk01','source.chunk02','source.chunk03','source.chunk04','source.chunk05','source.chunk06','source.chunk07','source.chunk08')
          $segments = @()
          foreach($n in $chunkNames){ $segments += (Get-Content (Join-Path '.\lanproxy-native-v330' $n) -Raw).Trim() }
          $all = $segments -join ''
          if($all.Length -ne 34880){ throw "Unexpected source payload length: $($all.Length)" }
          [IO.File]::WriteAllBytes((Join-Path $src 'main.go.gz'), [Convert]::FromBase64String($all))
          $in=[IO.File]::OpenRead((Resolve-Path (Join-Path $src 'main.go.gz')))
          try { $gz=New-Object IO.Compression.GzipStream($in,[IO.Compression.CompressionMode]::Decompress); try { $out=[IO.File]::Create((Join-Path (Resolve-Path $src) 'main.go')); try{$gz.CopyTo($out)}finally{$out.Dispose()} } finally{$gz.Dispose()} } finally{$in.Dispose()}

          $main = Join-Path $src 'main.go'
          $text = [IO.File]::ReadAllText((Resolve-Path $main))
          if(-not $text.Contains('appVersion = "3.3.0"')){ throw 'Expected v3.3 version marker not found' }
          $text = $text.Replace('appVersion = "3.3.0"','appVersion = "3.5.0"')
          if(-not $text.Contains('1080, 600, 0, 0, hInst, 0)')){ throw 'Expected v3.3 window size not found' }
          $text = $text.Replace('1080, 600, 0, 0, hInst, 0)','960, 620, 0, 0, hInst, 0)')

          $newLogo = @(
            'func drawWifi(hdc syscall.Handle, x, y int32) {',
            "`t// Brand mark: clean three-node share glyph, optimized for small desktop sizes.",
            "`tblue := rgb(37, 99, 235)",
            "`twhite := rgb(255, 255, 255)",
            "`tfillRounded(hdc, RECT{x, y, x + 38, y + 38}, 10, blue)",
            "`tline(hdc, x+14, y+19, x+24, y+12, white, 2)",
            "`tline(hdc, x+14, y+19, x+24, y+26, white, 2)",
            "`tcircle(hdc, x+11, y+19, 4, white, white)",
            "`tcircle(hdc, x+27, y+10, 4, white, white)",
            "`tcircle(hdc, x+27, y+28, 4, white, white)",
            '}'
          ) -join "`r`n"
          $sig = 'func drawWifi(hdc syscall.Handle, x, y int32) {'
          $start = $text.IndexOf($sig)
          if($start -lt 0){ throw 'Logo function start not found' }
          $close = $text.IndexOf("`n}", $start)
          if($close -lt 0){ throw 'Logo function end not found' }
          $after = $close + 2
          $patched = $text.Substring(0,$start) + $newLogo + $text.Substring($after)
          [IO.File]::WriteAllText((Resolve-Path $main), $patched, [Text.UTF8Encoding]::new($false))
          Copy-Item '.\lanproxy-native-v310\app.manifest' (Join-Path $src 'app.manifest') -Force
          Copy-Item '.\lanproxy-native-v310\go.mod' (Join-Path $src 'go.mod') -Force
          gofmt -w $main

      - name: Generate clean multi-size share app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          function New-RoundPath([float]$x,[float]$y,[float]$w,[float]$h,[float]$r){
            $p=[Drawing.Drawing2D.GraphicsPath]::new(); $d=$r*2
            $p.AddArc($x,$y,$d,$d,180,90); $p.AddArc($x+$w-$d,$y,$d,$d,270,90)
            $p.AddArc($x+$w-$d,$y+$h-$d,$d,$d,0,90); $p.AddArc($x,$y+$h-$d,$d,$d,90,90)
            $p.CloseFigure(); return $p
          }
          function Render-Logo([int]$s){
            $bmp=[Drawing.Bitmap]::new($s,$s,[Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.PixelOffsetMode=[Drawing.Drawing2D.PixelOffsetMode]::HighQuality
            $g.Clear([Drawing.Color]::Transparent)
            $pad=[float]($s*0.045)
            $rect=[Drawing.RectangleF]::new($pad,$pad,$s-2*$pad,$s-2*$pad)
            $path=New-RoundPath $rect.X $rect.Y $rect.Width $rect.Height ([float]($s*0.205))
            $c1=[Drawing.Color]::FromArgb(255,37,99,235)
            $c2=[Drawing.Color]::FromArgb(255,59,130,246)
            $grad=[Drawing.Drawing2D.LinearGradientBrush]::new($rect,$c1,$c2,55.0)
            $g.FillPath($grad,$path)
            $hi=[Drawing.Pen]::new([Drawing.Color]::FromArgb(65,255,255,255),[Math]::Max(1.0,$s*0.008))
            $g.DrawPath($hi,$path)
            $white=[Drawing.Color]::White
            $pen=[Drawing.Pen]::new($white,[Math]::Max(1.5,$s*0.052))
            $pen.StartCap=[Drawing.Drawing2D.LineCap]::Round; $pen.EndCap=[Drawing.Drawing2D.LineCap]::Round
            $x1=[float]($s*0.34); $y1=[float]($s*0.50)
            $x2=[float]($s*0.66); $y2=[float]($s*0.31)
            $x3=[float]($s*0.66); $y3=[float]($s*0.69)
            $g.DrawLine($pen,$x1,$y1,$x2,$y2)
            $g.DrawLine($pen,$x1,$y1,$x3,$y3)
            $brush=[Drawing.SolidBrush]::new($white)
            $r=[float]([Math]::Max(1.8,$s*0.072))
            foreach($pt in @(@($x1,$y1),@($x2,$y2),@($x3,$y3))){ $g.FillEllipse($brush,[float]$pt[0]-$r,[float]$pt[1]-$r,$r*2,$r*2) }
            $ms=[IO.MemoryStream]::new(); $bmp.Save($ms,[Drawing.Imaging.ImageFormat]::Png); $data=$ms.ToArray()
            $ms.Dispose(); $brush.Dispose(); $pen.Dispose(); $hi.Dispose(); $grad.Dispose(); $path.Dispose(); $g.Dispose(); $bmp.Dispose()
            return ,$data
          }
          $sizes=@(16,20,24,32,40,48,64,128,256); $images=@()
          foreach($s in $sizes){ $images += [pscustomobject]@{Size=$s;Data=(Render-Logo $s)} }
          $out=(Resolve-Path '.\lanproxy-native-v350\src').Path+'\app.ico'
          $fs=[IO.File]::Create($out); $bw=[IO.BinaryWriter]::new($fs)
          $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]$images.Count)
          $offset=6+16*$images.Count
          foreach($im in $images){
            $wh=if($im.Size -ge 256){[byte]0}else{[byte]$im.Size}
            $bw.Write($wh); $bw.Write($wh); $bw.Write([byte]0); $bw.Write([byte]0); $bw.Write([UInt16]1); $bw.Write([UInt16]32)
            $bw.Write([UInt32]$im.Data.Length); $bw.Write([UInt32]$offset); $offset += $im.Data.Length
          }
          foreach($im in $images){ $bw.Write([byte[]]$im.Data) }
          $bw.Dispose(); $fs.Dispose()
          Write-Host "Icon SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Embed icon and administrator manifest
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v350\src
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico app.ico -arch amd64 -o resource_windows_amd64.syso
          if(-not (Test-Path '.\resource_windows_amd64.syso')){ throw 'resource syso was not created' }

      - name: Build lightweight native single EXE
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v350\src
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '..\局域网代理共享助手.exe' .
          $app=Get-Item '..\局域网代理共享助手.exe'
          Write-Host "EXE size=$($app.Length) bytes"
          if($app.Length -gt 10000000){ throw 'Native EXE unexpectedly exceeds 10 MB' }

      - name: Runtime smoke test and preview
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\lanproxy-native-v350\局域网代理共享助手.exe').Path
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(15)
          do{ Start-Sleep -Milliseconds 400; $p.Refresh(); if($p.HasExited){throw "App exited early code $($p.ExitCode)"} }until($p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if($p.MainWindowHandle -eq 0){ throw 'No main window appeared' }
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class NC { [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessageTimeout(IntPtr h,uint m,IntPtr w,IntPtr l,uint f,uint t,out IntPtr r); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r); public struct RECT { public int Left,Top,Right,Bottom; } }'
          $result=[IntPtr]::Zero
          if([NC]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$result) -eq [IntPtr]::Zero){ throw 'UI not responding' }
          $wr=New-Object NC+RECT; [NC]::GetWindowRect($p.MainWindowHandle,[ref]$wr)|Out-Null
          $w=$wr.Right-$wr.Left; $h=$wr.Bottom-$wr.Top; Write-Host "Window size=${w}x${h}"
          if($w -ne 960 -or $h -ne 620){ throw "Unexpected window size ${w}x${h}" }
          Start-Sleep -Seconds 8; $p.Refresh(); if($p.HasExited){throw 'App exited during background scan'}
          $result=[IntPtr]::Zero; if([NC]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$result) -eq [IntPtr]::Zero){ throw 'UI froze during scan' }
          try{
            Add-Type -AssemblyName System.Drawing
            $bmp=[Drawing.Bitmap]::new($w,$h); $g=[Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($wr.Left,$wr.Top,0,0,[Drawing.Size]::new($w,$h))
            $shot=(Resolve-Path '.\lanproxy-native-v350').Path+'\v350-preview.png'; $bmp.Save($shot,[Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }catch{ Write-Warning $_.Exception.Message }
          Stop-Process $p -Force -ErrorAction SilentlyContinue

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\lanproxy-native-v350\局域网代理共享助手.exe').Path
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "SHA256=$hash"
          Set-Content '.\lanproxy-native-v350\sha256.txt' $hash -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v3.5.0-balanced-ratio-logo
          path: |
            .\lanproxy-native-v350\局域网代理共享助手.exe
            .\lanproxy-native-v350\sha256.txt
            .\lanproxy-native-v350\v350-preview.png
          if-no-files-found: error
