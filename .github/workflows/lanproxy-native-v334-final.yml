name: LANProxy Native v3.3.4 Foolproof Verified

on:
  push:
    branches: [lanproxy-native-v334-foolproof]
    paths:
      - 'lanproxy-native-v334/**'
      - '.github/workflows/lanproxy-native-v334-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Rebuild verified source
        shell: pwsh
        run: |
          $base='.\lanproxy-native-v333'; $root='.\lanproxy-native-v334'; $src=Join-Path $root 'src'
          if(Test-Path $src){Remove-Item $src -Recurse -Force}; New-Item -ItemType Directory -Path $src -Force|Out-Null
          $names=@('source.part00','source.fix01a','source.fix01b','source.fix02a','source.fix02b','source.part03','source.part04','source.part05')
          $payload=($names|%{(Get-Content (Join-Path $base $_) -Raw).Trim()}) -join ''
          if($payload.Length -ne 35520){throw "payload length $($payload.Length)"}
          [IO.File]::WriteAllBytes((Join-Path $root 'main.go.gz'),[Convert]::FromBase64String($payload))
          $i=[IO.File]::OpenRead((Resolve-Path (Join-Path $root 'main.go.gz')))
          try{$g=New-Object IO.Compression.GzipStream($i,[IO.Compression.CompressionMode]::Decompress);try{$o=[IO.File]::Create((Join-Path (Resolve-Path $src) 'main.go'));try{$g.CopyTo($o)}finally{$o.Dispose()}}finally{$g.Dispose()}}finally{$i.Dispose()}
          python -c "import base64,gzip,pathlib; r=pathlib.Path('lanproxy-native-v334'); (r/'v334.patch').write_bytes(gzip.decompress(base64.b64decode((r/'v334.patch.gz.b64').read_text().strip())))"
          git apply --check --directory=lanproxy-native-v334/src lanproxy-native-v334/v334.patch
          if($LASTEXITCODE -ne 0){throw 'patch check failed'}
          git apply --directory=lanproxy-native-v334/src lanproxy-native-v334/v334.patch
          if($LASTEXITCODE -ne 0){throw 'patch failed'}
          gofmt -w (Join-Path $src 'main.go')
          $h=(Get-FileHash (Join-Path $src 'main.go') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_SHA256=$h"
          if($h -ne 'a8f794442290aade93905b85e3c26f9ff930dabc8ed32bdcb98f8fdc3639ba04'){throw "source hash mismatch $h"}
          Copy-Item '.\lanproxy-native-v310\app.manifest' (Join-Path $src 'app.manifest') -Force
          Copy-Item '.\lanproxy-native-v310\go.mod' (Join-Path $src 'go.mod') -Force

      - name: Generate product icon
        shell: pwsh
        run: |
          python -m pip install pillow --disable-pip-version-check -q
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          def mk(size):
              q=4; S=size*q; im=Image.new('RGBA',(S,S)); mask=Image.new('L',(S,S)); md=ImageDraw.Draw(mask); pad=int(S*.055); md.rounded_rectangle((pad,pad,S-pad,S-pad),radius=int(S*.22),fill=255)
              bg=Image.new('RGBA',(S,S)); px=bg.load(); a=(34,119,238); b=(15,89,205)
              for y in range(S):
                  t=y/max(1,S-1); c=tuple(round(a[i]*(1-t)+b[i]*t) for i in range(3))+(255,)
                  for x in range(S): px[x,y]=c
              im=Image.composite(bg,im,mask); d=ImageDraw.Draw(im); W=(255,255,255,255); F=(225,239,255,255); sc=lambda v:int(v*S)
              def rr(box,r,w=.03): d.rounded_rectangle(tuple(sc(v) for v in box),radius=max(1,sc(r)),outline=W,width=max(1,sc(w)))
              rr((.405,.10,.595,.33),.033,.028); d.line((sc(.46),sc(.145),sc(.54),sc(.145)),fill=F,width=max(1,sc(.012))); d.ellipse((sc(.487),sc(.285),sc(.513),sc(.311)),fill=W)
              for box,wd in [((.23,.28,.77,.68),.037),((.31,.36,.69,.66),.038),((.39,.44,.61,.64),.04)]: d.arc(tuple(sc(v) for v in box),start=205,end=335,fill=W,width=max(1,sc(wd)))
              d.ellipse((sc(.475),sc(.61),sc(.525),sc(.66)),fill=W); rr((.20,.70,.80,.85),.035,.03); d.line((sc(.50),sc(.85),sc(.50),sc(.90)),fill=W,width=max(1,sc(.022))); d.line((sc(.38),sc(.90),sc(.62),sc(.90)),fill=W,width=max(1,sc(.028)))
              return im.resize((size,size),Image.Resampling.LANCZOS)
          out=Path(r'lanproxy-native-v334/src/app.ico'); mk(256).save(out,format='ICO',sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content '.\lanproxy-native-v334\icon_final.py' -Encoding utf8
          python '.\lanproxy-native-v334\icon_final.py'
          Set-Location .\lanproxy-native-v334\src
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico app.ico -arch amd64 -o resource_windows_amd64.syso
          if(-not(Test-Path '.\resource_windows_amd64.syso')){throw 'resource embedding failed'}

      - name: Build single EXE
        shell: pwsh
        run: |
          Set-Location .\lanproxy-native-v334\src
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '..\局域网代理共享助手.exe' .
          $e=Get-Item '..\局域网代理共享助手.exe'; Write-Host "EXE_SIZE=$($e.Length)"; if($e.Length -gt 10000000){throw 'EXE too large'}

      - name: Verify startup repair and capture pages
        shell: pwsh
        run: |
          $cfg=Join-Path $env:LOCALAPPDATA 'LANProxyShareAssistant'; New-Item -ItemType Directory -Path $cfg -Force|Out-Null
          '{"ip":"","http_local":0,"socks_local":0,"http_lan":99999,"socks_lan":-1,"share_socks":false,"last_process":""}'|Set-Content (Join-Path $cfg 'config.json') -Encoding utf8
          $exe=(Resolve-Path '.\lanproxy-native-v334\局域网代理共享助手.exe').Path; $p=Start-Process $exe -PassThru; $dl=(Get-Date).AddSeconds(15)
          do{Start-Sleep -Milliseconds 400;$p.Refresh();if($p.HasExited){throw "early exit $($p.ExitCode)"}}until($p.MainWindowHandle -ne 0 -or (Get-Date)-gt$dl); if($p.MainWindowHandle -eq 0){throw 'no window'}
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition 'using System;using System.Text;using System.Runtime.InteropServices;public static class N{[DllImport("user32.dll",SetLastError=true)]public static extern IntPtr SendMessageTimeout(IntPtr h,uint m,IntPtr w,IntPtr l,uint f,uint t,out IntPtr r);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);[DllImport("user32.dll")]public static extern IntPtr GetDlgItem(IntPtr h,int id);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowText(IntPtr h,StringBuilder s,int n);public struct R{public int Left,Top,Right,Bottom;}}'
          function Txt($id){$e=[N]::GetDlgItem($p.MainWindowHandle,$id);$s=New-Object Text.StringBuilder 64;[void][N]::GetWindowText($e,$s,64);return $s.ToString()}
          function AssertPorts($stage){$h=Txt 1304;$s=Txt 1305;Write-Host "$stage HTTP=$h SOCKS=$s";if($h -ne '18800'){throw "$stage HTTP share port corrupted: $h"};if($s -ne '11020'){throw "$stage SOCKS share port corrupted: $s"}}
          Start-Sleep -Milliseconds 800; AssertPorts 'startup'
          Start-Sleep -Seconds 7; AssertPorts 'after-scan'
          $r=[IntPtr]::Zero;if([N]::SendMessageTimeout($p.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,2000,[ref]$r)-eq[IntPtr]::Zero){throw 'UI unresponsive'}
          $wr=New-Object N+R
          function Shot($n){$p.Refresh();[void][N]::GetWindowRect($p.MainWindowHandle,[ref]$wr);$w=$wr.Right-$wr.Left;$h=$wr.Bottom-$wr.Top;$b=New-Object Drawing.Bitmap $w,$h;$g=[Drawing.Graphics]::FromImage($b);$g.CopyFromScreen($wr.Left,$wr.Top,0,0,(New-Object Drawing.Size $w,$h));$b.Save((Resolve-Path '.\lanproxy-native-v334').Path+'\'+$n+'.png');$g.Dispose();$b.Dispose()}
          function Click($x,$y){$lp=[IntPtr](($y-shl 16)-bor($x-band 0xffff));[void][N]::PostMessage($p.MainWindowHandle,0x0201,[IntPtr]1,$lp);[void][N]::PostMessage($p.MainWindowHandle,0x0202,[IntPtr]0,$lp);Start-Sleep -Milliseconds 700}
          Shot 'home';Click 586 32;Shot 'phone';Click 684 32;Shot 'devices';Click 793 32;Shot 'advanced';AssertPorts 'advanced-page';Stop-Process $p -Force

      - name: Checksum
        shell: pwsh
        run: |
          $e=(Resolve-Path '.\lanproxy-native-v334\局域网代理共享助手.exe').Path;$h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();Write-Host "SHA256=$h";Set-Content '.\lanproxy-native-v334\sha256.txt' $h -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v3.3.4-foolproof-verified
          path: |
            .\lanproxy-native-v334\局域网代理共享助手.exe
            .\lanproxy-native-v334\sha256.txt
            .\lanproxy-native-v334\home.png
            .\lanproxy-native-v334\phone.png
            .\lanproxy-native-v334\devices.png
            .\lanproxy-native-v334\advanced.png
          if-no-files-found: error
