name: LANProxy Native v3.6 Distribution Friendly

on:
  push:
    branches:
      - lanproxy-native-v340-ratio-logo
    paths:
      - '.github/workflows/lanproxy-native-v360-distribution.yml'
      - '.github/scripts/build-v360.ps1'
      - 'lanproxy-native-v330/source.chunk*'
      - 'lanproxy-native-v310/app.manifest'
      - 'lanproxy-native-v310/go.mod'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build and validate v3.6
        shell: pwsh
        run: .\.github\scripts\build-v360.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LANProxyShareAssistant-v3.6.0-distribution-friendly
          path: |
            .\lanproxy-native-v360\局域网代理共享助手.exe
            .\lanproxy-native-v360\sha256.txt
          if-no-files-found: error
